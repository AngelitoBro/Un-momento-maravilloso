<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Ti ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{

background:linear-gradient(135deg,#0f0f0f,#1e1e1e,#2b2b2b);

height:100vh;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

}

.contenedor{

width:100%;

height:100%;

position:relative;

}

.portada{

position:absolute;

width:100%;

height:100%;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

color:white;

text-align:center;

background:linear-gradient(135deg,#111,#222,#333);

transition:1s;

z-index:10;

}

.portada h1{

font-size:45px;

margin-bottom:15px;

}

.portada p{

font-size:22px;

opacity:.8;

margin-bottom:30px;

}

button{

padding:18px 40px;

font-size:22px;

border:none;

border-radius:50px;

cursor:pointer;

background:#ff4d6d;

color:white;

transition:.3s;

}

button:hover{

transform:scale(1.05);

box-shadow:0 0 20px #ff4d6d;

}

iframe{

width:100%;

height:100vh;

border:none;

display:none;

}

#musicaBtn{

position:fixed;

top:20px;

right:20px;

z-index:100;

display:none;

background:#111;

}

.corazon{

position:fixed;

top:-50px;

font-size:30px;

animation:caer linear forwards;

pointer-events:none;

}

@keyframes caer{

0%{

transform:translateY(-100px);

opacity:1;

}

100%{

transform:translateY(110vh);

opacity:0;

}

}

</style>

</head>

<body>

<div class="contenedor">

<div class="portada" id="portada">

<h1>💌 Tengo algo para ti</h1>

<p>No es una simple carta...</p>

<p>Es un pedacito de mi corazón ❤️</p>

<br>

<button onclick="abrirCarta()">

Abrir Carta ❤️

</button>

</div>

<button id="musicaBtn" onclick="toggleMusic()">

🎵 Música

</button>

<iframe id="visor" src="carta.html"></iframe>

</div>

<audio id="musica" loop>

<source src="musica.mp3" type="audio/mpeg">

</audio>

<script>

const musica=document.getElementById("musica");

musica.volume=.25;

function abrirCarta(){

musica.play();

document.getElementById("portada").style.display="none";

document.getElementById("visor").style.display="block";

document.getElementById("musicaBtn").style.display="block";

lluvia();

}

function toggleMusic(){

if(musica.paused){

musica.play();

}else{

musica.pause();

}

}

function lluvia(){

setInterval(()=>{

const h=document.createElement("div");

h.className="corazon";

h.innerHTML="❤️";

h.style.left=Math.random()*100+"vw";

h.style.animationDuration=(Math.random()*3+3)+"s";

document.body.appendChild(h);

setTimeout(()=>{

h.remove();

},6000);

},350);

}

</script>

</body>

</html>
