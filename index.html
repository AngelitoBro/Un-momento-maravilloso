<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Ti ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{

background:linear-gradient(135deg,#111,#1b1b1b,#2b2b2b);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;

}

.container{

width:90%;
max-width:900px;
height:90vh;

background:white;

border-radius:25px;

overflow:hidden;

box-shadow:0px 20px 50px rgba(0,0,0,.5);

position:relative;

}

.inicio{

position:absolute;

width:100%;
height:100%;

background:linear-gradient(135deg,#111,#222,#333);

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

color:white;

text-align:center;

transition:1s;

z-index:5;

}

.inicio h1{

font-size:42px;

margin-bottom:15px;

}

.inicio p{

font-size:20px;

opacity:.8;

margin-bottom:30px;

}

button{

padding:18px 40px;

font-size:20px;

border:none;

border-radius:50px;

cursor:pointer;

background:#ff4d6d;

color:white;

transition:.3s;

}

button:hover{

transform:scale(1.08);

box-shadow:0 0 20px #ff4d6d;

}

#visor{

display:none;

width:100%;

height:100%;

}

iframe{

width:100%;

height:100%;

border:none;

}

#musicaBtn{

position:absolute;

top:20px;

right:20px;

display:none;

z-index:100;

background:#111;

}

#mensaje{

position:absolute;

bottom:20px;

left:50%;

transform:translateX(-50%);

background:rgba(0,0,0,.75);

padding:15px 25px;

color:white;

border-radius:50px;

display:none;

font-size:18px;

}

.heart{

position:fixed;

color:#ff4d6d;

font-size:25px;

animation:caer linear forwards;

pointer-events:none;

}

@keyframes caer{

0%{

transform:translateY(-100px) rotate(0deg);

opacity:1;

}

100%{

transform:translateY(110vh) rotate(720deg);

opacity:0;

}

}

</style>

</head>

<body>

<div class="container">

<div class="inicio" id="inicio">

<h1>💌 Tengo algo para ti</h1>

<p>No es un simple documento...</p>

<p>Es una parte de mi corazón ❤️</p>

<button onclick="abrirCarta()">

Abrir Carta

</button>

</div>

<button id="musicaBtn" onclick="toggleMusic()">

🎵 Música

</button>

<div id="visor">

<iframe src="carta.pdf"></iframe>

</div>

<div id="mensaje">

Gracias por leer mi carta ❤️

</div>

</div>

<audio id="musica" loop>

<source src="musica.mp3" type="audio/mpeg">

</audio>

<script>

const musica=document.getElementById("musica");

musica.volume=.25;

function abrirCarta(){

document.getElementById("inicio").style.opacity="0";

setTimeout(()=>{

document.getElementById("inicio").style.display="none";

document.getElementById("visor").style.display="block";

document.getElementById("musicaBtn").style.display="block";

document.getElementById("mensaje").style.display="block";

musica.play();

},800);

lluvia();

}

function toggleMusic(){

if(musica.paused){

musica.play();

}else{

musica.pause();

}

}

function lluvia(){

setInterval(()=>{

const heart=document.createElement("div");

heart.classList.add("heart");

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.animationDuration=(Math.random()*3+3)+"s";

heart.style.fontSize=(Math.random()*20+20)+"px";

document.body.appendChild(heart);

setTimeout(()=>{

heart.remove();

},6000);

},300);

}

</script>

</body>

</html>
